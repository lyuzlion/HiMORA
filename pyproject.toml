[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "himora-sabs"
version = "0.1.0"
description = "History-conditioned multi-stage outcome modeling and support-aware budget search"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "torch>=2.1,<3"]

[project.scripts]
himora = "himora.__main__:main"

[tool.setuptools.packages.find]
include = ["himora*"]
